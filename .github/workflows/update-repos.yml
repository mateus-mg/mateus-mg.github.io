name: Update Repository Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fetch repositories
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repos.py

      - name: Create Pull Request if changed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure git to use DEPLOY_TOKEN for authentication
          git remote set-url origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git diff --quiet data/repos.json; then
            echo "No changes to repos.json"
            exit 0
          fi

          BRANCH="update-repos-data-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add data/repos.json
          git commit -m "chore: update repository data"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: update repository data" \
            --body "Auto-generated update from GitHub API." \
            --base main \
            --head "$BRANCH"

  auto-merge:
    runs-on: ubuntu-latest
    needs: update-repos
    if: "github.event_name == 'pull_request' && contains(fromJSON('[\"github-actions[bot]\", \"mateus-mg\"]'), github.event.pull_request.user.login) && github.event.pull_request.title == 'chore: update repository data'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch \
            --subject "chore: update repository data" \
            --admin
