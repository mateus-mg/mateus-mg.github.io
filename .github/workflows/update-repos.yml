name: Update Repository Data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fetch repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repos.py

      - name: Create Pull Request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/repos.json; then
            echo "No changes to repos.json"
            exit 0
          fi

          BRANCH="update-repos-data-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add data/repos.json
          git commit -m "chore: update repository data"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: update repository data" \
            --body "Auto-generated update from GitHub API." \
            --base main \
            --head "$BRANCH"
